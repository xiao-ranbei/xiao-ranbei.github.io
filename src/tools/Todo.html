<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>番茄钟 · Pomodoro Timer</title>
    <style>
        /* ===== Reset & Base ===== */
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --primary-dark: #1E3A8A;
            --primary-mid:  #3B82F6;
            --primary-light: #60A5FA;
            --primary-ghost: rgba(96, 165, 250, 0.12);
            --bg-gradient-1: #f0f4ff;
            --bg-gradient-2: #e8f0fe;
            --glass-bg: rgba(255, 255, 255, 0.55);
            --glass-border: rgba(255, 255, 255, 0.35);
            --glass-shadow: rgba(30, 58, 138, 0.08);
            --text-primary: #1E293B;
            --text-secondary: #64748B;
            --text-light: #FFFFFF;
            --card-bg: rgba(255, 255, 255, 0.72);
            --card-border: rgba(255, 255, 255, 0.5);
            --card-shadow: 0 8px 32px rgba(30, 58, 138, 0.10);
            --radius: 20px;
            --radius-sm: 12px;
            --radius-xs: 8px;
            --transition: 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            --focus-color: #3B82F6;
            --short-color: #10B981;
            --long-color: #8B5CF6;
        }

        html { font-size: 16px; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(145deg, var(--bg-gradient-1), var(--bg-gradient-2));
            padding: 20px;
            color: var(--text-primary);
            -webkit-font-smoothing: antialiased;
        }

        /* ===== Main Container ===== */
        .app {
            width: 100%;
            max-width: 520px;
            background: var(--glass-bg);
            backdrop-filter: blur(18px) saturate(1.4);
            -webkit-backdrop-filter: blur(18px) saturate(1.4);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius);
            padding: 40px 32px 36px;
            box-shadow: var(--card-shadow), 0 0 0 1px rgba(255,255,255,0.5) inset;
            transition: var(--transition);
        }

        /* ===== Header ===== */
        .app-header {
            text-align: center;
            margin-bottom: 28px;
        }
        .app-header h1 {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: 2px;
            background: linear-gradient(135deg, var(--primary-dark), var(--primary-light));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .app-header p {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-top: 4px;
            letter-spacing: 4px;
        }

        /* ===== Mode Cards ===== */
        .mode-switcher {
            display: flex;
            gap: 10px;
            margin-bottom: 32px;
            justify-content: center;
        }
        .mode-card {
            flex: 1;
            max-width: 152px;
            padding: 12px 10px;
            border-radius: var(--radius-sm);
            background: var(--card-bg);
            border: 1.5px solid transparent;
            box-shadow: 0 2px 8px rgba(30,58,138,0.04);
            cursor: pointer;
            text-align: center;
            transition: var(--transition);
            user-select: none;
            position: relative;
            overflow: hidden;
        }
        .mode-card::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            opacity: 0;
            transition: opacity 0.4s ease;
        }
        .mode-card:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 6px 20px rgba(30,58,138,0.12);
        }
        .mode-card:active { transform: scale(0.96); }
        .mode-card .icon {
            font-size: 1.4rem;
            display: block;
            margin-bottom: 3px;
            position: relative;
            z-index: 1;
        }
        .mode-card .label {
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--text-secondary);
            transition: color var(--transition);
            position: relative;
            z-index: 1;
        }
        .mode-card .duration {
            font-size: 0.7rem;
            color: var(--text-secondary);
            opacity: 0.65;
            margin-top: 1px;
            position: relative;
            z-index: 1;
        }

        /* Active state per mode */
        .mode-card.active-focus {
            border-color: var(--focus-color);
            background: rgba(59, 130, 246, 0.10);
            box-shadow: 0 4px 16px rgba(59,130,246,0.18);
        }
        .mode-card.active-focus .label { color: var(--focus-color); }
        .mode-card.active-focus::before {
            background: radial-gradient(circle at center, rgba(59,130,246,0.08) 0%, transparent 70%);
            opacity: 1;
        }

        .mode-card.active-short {
            border-color: var(--short-color);
            background: rgba(16, 185, 129, 0.10);
            box-shadow: 0 4px 16px rgba(16,185,129,0.18);
        }
        .mode-card.active-short .label { color: var(--short-color); }
        .mode-card.active-short::before {
            background: radial-gradient(circle at center, rgba(16,185,129,0.08) 0%, transparent 70%);
            opacity: 1;
        }

        .mode-card.active-long {
            border-color: var(--long-color);
            background: rgba(139, 92, 246, 0.10);
            box-shadow: 0 4px 16px rgba(139,92,246,0.18);
        }
        .mode-card.active-long .label { color: var(--long-color); }
        .mode-card.active-long::before {
            background: radial-gradient(circle at center, rgba(139,92,246,0.08) 0%, transparent 70%);
            opacity: 1;
        }

        /* Sliding indicator */
        .mode-indicator {
            position: relative;
            display: flex;
            height: 3px;
            margin: -6px 0 0;
            justify-content: center;
        }
        .mode-indicator .slide {
            width: 60px;
            height: 3px;
            border-radius: 4px;
            background: var(--focus-color);
            transition: transform var(--transition), background var(--transition);
        }
        .mode-indicator .slide.pos-1 { transform: translateX(-104px); }
        .mode-indicator .slide.pos-2 { transform: translateX(0); }
        .mode-indicator .slide.pos-3 { transform: translateX(104px); }
        .mode-indicator .slide.color-focus { background: var(--focus-color); }
        .mode-indicator .slide.color-short { background: var(--short-color); }
        .mode-indicator .slide.color-long  { background: var(--long-color); }

        /* ===== Timer Display ===== */
        .timer-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 20px 0 12px;
            position: relative;
        }

        .progress-ring-container {
            position: relative;
            width: 260px;
            height: 260px;
        }

        .progress-ring {
            transform: rotate(-90deg);
            width: 100%;
            height: 100%;
        }
        .progress-ring .bg-circle {
            fill: none;
            stroke: rgba(59, 130, 246, 0.10);
            stroke-width: 6;
        }
        .progress-ring .fg-circle {
            fill: none;
            stroke: var(--focus-color);
            stroke-width: 6;
            stroke-linecap: round;
            stroke-dasharray: 753.98;
            stroke-dashoffset: 0;
            transition: stroke-dashoffset 0.45s ease, stroke 0.5s ease;
        }
        .progress-ring .fg-circle.mode-focus { stroke: var(--focus-color); }
        .progress-ring .fg-circle.mode-short  { stroke: var(--short-color); }
        .progress-ring .fg-circle.mode-long   { stroke: var(--long-color); }

        /* Timer glow */
        .progress-ring-container::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 200px;
            height: 200px;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            background: radial-gradient(circle, rgba(59,130,246,0.04) 0%, transparent 70%);
            pointer-events: none;
            transition: background 0.5s ease;
        }
        .progress-ring-container.glow-focus::after { background: radial-gradient(circle, rgba(59,130,246,0.06) 0%, transparent 70%); }
        .progress-ring-container.glow-short::after  { background: radial-gradient(circle, rgba(16,185,129,0.06) 0%, transparent 70%); }
        .progress-ring-container.glow-long::after   { background: radial-gradient(circle, rgba(139,92,246,0.06) 0%, transparent 70%); }

        .timer-display {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }
        .timer-display .time {
            font-size: 3.6rem;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            letter-spacing: 3px;
            color: var(--text-primary);
            line-height: 1;
            transition: color 0.4s ease;
        }
        .timer-display .time.mode-focus { color: var(--focus-color); }
        .timer-display .time.mode-short  { color: var(--short-color); }
        .timer-display .time.mode-long   { color: var(--long-color); }
        .timer-display .time-label {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-top: 6px;
            letter-spacing: 2px;
        }

        /* Completion flash */
        .timer-section.flash {
            animation: flashPulse 0.6s ease-in-out 3;
        }
        @keyframes flashPulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.15; }
        }

        /* ===== Controls ===== */
        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 14px;
            margin: 22px 0 20px;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: none;
            border-radius: 50px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .btn::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            background: radial-gradient(circle at var(--mx,50%) var(--my,50%), rgba(255,255,255,0.2) 0%, transparent 60%);
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .btn:hover::after { opacity: 1; }

        .btn-primary {
            padding: 14px 44px;
            background: linear-gradient(145deg, var(--primary-mid), var(--primary-dark));
            color: var(--text-light);
            box-shadow: 0 4px 16px rgba(59,130,246,0.30);
            letter-spacing: 1px;
        }
        .btn-primary:hover {
            transform: translateY(-2px) scale(1.03);
            box-shadow: 0 8px 28px rgba(59,130,246,0.40);
        }
        .btn-primary:active { transform: scale(0.96); }

        .btn-secondary {
            width: 48px;
            height: 48px;
            padding: 0;
            background: var(--card-bg);
            border: 1px solid rgba(59,130,246,0.15);
            color: var(--text-secondary);
            box-shadow: 0 2px 8px rgba(30,58,138,0.06);
            font-size: 1.2rem;
        }
        .btn-secondary:hover {
            transform: translateY(-2px) scale(1.08);
            box-shadow: 0 6px 20px rgba(30,58,138,0.12);
            color: var(--primary-mid);
            border-color: var(--primary-mid);
        }
        .btn-secondary:active { transform: scale(0.92); }

        /* ===== Stats ===== */
        .stats {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 24px;
            padding-top: 16px;
            border-top: 1px solid rgba(59,130,246,0.08);
        }
        .stat-item {
            text-align: center;
        }
        .stat-item .stat-number {
            font-size: 1.2rem;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            color: var(--text-primary);
        }
        .stat-item .stat-label {
            font-size: 0.7rem;
            color: var(--text-secondary);
            letter-spacing: 1px;
            margin-top: 1px;
        }

        /* ===== Responsive ===== */
        @media (max-width: 480px) {
            .app { padding: 28px 18px 24px; border-radius: 16px; }
            .app-header h1 { font-size: 1.3rem; }
            .mode-card { padding: 10px 6px; }
            .mode-card .icon { font-size: 1.2rem; }
            .mode-card .label { font-size: 0.72rem; }
            .mode-card .duration { font-size: 0.65rem; }
            .progress-ring-container { width: 210px; height: 210px; }
            .timer-display .time { font-size: 2.8rem; }
            .btn-primary { padding: 12px 34px; font-size: 0.9rem; }
            .btn-secondary { width: 42px; height: 42px; font-size: 1rem; }
            .mode-indicator .slide { width: 44px; }
            .mode-indicator .slide.pos-1 { transform: translateX(-78px); }
            .mode-indicator .slide.pos-2 { transform: translateX(0); }
            .mode-indicator .slide.pos-3 { transform: translateX(78px); }
        }

        @media (max-width: 360px) {
            .app { padding: 20px 12px 18px; }
            .progress-ring-container { width: 170px; height: 170px; }
            .timer-display .time { font-size: 2.2rem; }
            .mode-switcher { gap: 6px; }
            .controls { gap: 10px; }
            .btn-primary { padding: 10px 26px; font-size: 0.85rem; }
            .mode-indicator .slide { width: 34px; }
            .mode-indicator .slide.pos-1 { transform: translateX(-60px); }
            .mode-indicator .slide.pos-2 { transform: translateX(0); }
            .mode-indicator .slide.pos-3 { transform: translateX(60px); }
        }

        @media (min-width: 768px) {
            .app { padding: 48px 40px 40px; max-width: 560px; }
            .progress-ring-container { width: 290px; height: 290px; }
            .timer-display .time { font-size: 4rem; }
        }

        /* ===== Mode Slide Animation ===== */
        .mode-card {
            animation: cardFadeIn 0.4s ease backwards;
        }
        .mode-card:nth-child(1) { animation-delay: 0.05s; }
        .mode-card:nth-child(2) { animation-delay: 0.10s; }
        .mode-card:nth-child(3) { animation-delay: 0.15s; }
        @keyframes cardFadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* App entrance */
        .app { animation: appEnter 0.5s ease backwards; }
        @keyframes appEnter {
            from { opacity: 0; transform: translateY(16px) scale(0.98); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }
    </style>
</head>
<body>

<main class="app" role="main" aria-label="番茄钟应用">

    <!-- Header -->
    <header class="app-header">
        <h1>🍅 番茄钟</h1>
        <p>POMODORO TIMER</p>
    </header>

    <!-- Mode Switcher -->
    <section aria-label="模式选择">
        <div class="mode-switcher">
            <button class="mode-card active-focus" data-mode="focus" aria-pressed="true" type="button">
                <span class="icon">🎯</span>
                <span class="label">专注</span>
                <span class="duration">25:00</span>
            </button>
            <button class="mode-card" data-mode="short" aria-pressed="false" type="button">
                <span class="icon">☕</span>
                <span class="label">短休息</span>
                <span class="duration">05:00</span>
            </button>
            <button class="mode-card" data-mode="long" aria-pressed="false" type="button">
                <span class="icon">🌿</span>
                <span class="label">长休息</span>
                <span class="duration">15:00</span>
            </button>
        </div>
        <!-- Sliding indicator -->
        <div class="mode-indicator" aria-hidden="true">
            <span class="slide pos-1 color-focus"></span>
        </div>
    </section>

    <!-- Timer -->
    <section class="timer-section" aria-label="计时器">
        <div class="progress-ring-container glow-focus">
            <svg class="progress-ring" viewBox="0 0 250 250" aria-hidden="true">
                <circle class="bg-circle" cx="125" cy="125" r="120" />
                <circle class="fg-circle mode-focus" cx="125" cy="125" r="120"
                        id="progressCircle" />
            </svg>
            <div class="timer-display">
                <div class="time mode-focus" id="timerDisplay">25:00</div>
                <div class="time-label" id="statusLabel">准备开始</div>
            </div>
        </div>
    </section>

    <!-- Controls -->
    <section class="controls" aria-label="控制按钮">
        <button class="btn btn-secondary" id="resetBtn" aria-label="重置" title="重置">
            ↻
        </button>
        <button class="btn btn-primary" id="mainBtn" type="button">
            开始
        </button>
        <button class="btn btn-secondary" id="skipBtn" aria-label="跳过" title="跳过当前阶段">
            ⏭
        </button>
    </section>

    <!-- Stats -->
    <footer class="stats" aria-label="统计信息">
        <div class="stat-item">
            <div class="stat-number" id="completedCount">0</div>
            <div class="stat-label">已完成</div>
        </div>
        <div class="stat-item">
            <div class="stat-number" id="currentSession">1 / 4</div>
            <div class="stat-label">当前轮次</div>
        </div>
        <div class="stat-item">
            <div class="stat-number" id="totalFocus">0</div>
            <div class="stat-label">总专注(分)</div>
        </div>
    </footer>

</main>

<script>
    (function() {
        'use strict';

        // ===== Constants =====
        const CONFIG = {
            focus:  { duration: 25 * 60, label: '专注时间', icon: '🎯' },
            short:  { duration:  5 * 60, label: '短休息',   icon: '☕' },
            long:   { duration: 15 * 60, label: '长休息',   icon: '🌿' },
        };
        const LONG_BREAK_INTERVAL = 4;  // every 4 focus sessions

        // ===== State =====
        let state = {
            mode: 'focus',          // 'focus' | 'short' | 'long'
            timeLeft: 25 * 60,
            totalTime: 25 * 60,
            isRunning: false,
            isPaused: false,
            intervalId: null,
            completedPomodoros: 0,
            focusSessionCount: 0,   // focus sessions in current cycle
            totalFocusMinutes: 0,
            phase: 'idle',          // 'idle' | 'running' | 'paused' | 'finished'
        };

        // ===== DOM References =====
        const $ = (sel) => document.querySelector(sel);
        const $$ = (sel) => document.querySelectorAll(sel);

        const timerDisplay    = $('#timerDisplay');
        const statusLabel     = $('#statusLabel');
        const mainBtn         = $('#mainBtn');
        const resetBtn        = $('#resetBtn');
        const skipBtn         = $('#skipBtn');
        const progressCircle  = $('#progressCircle');
        const timerSection    = document.querySelector('.timer-section');
        const ringContainer   = document.querySelector('.progress-ring-container');
        const modeCards       = $$('.mode-card');
        const indicator       = document.querySelector('.mode-indicator .slide');
        const completedCount  = $('#completedCount');
        const currentSession  = $('#currentSession');
        const totalFocus      = $('#totalFocus');

        const CIRCUMFERENCE   = 2 * Math.PI * 120; // ≈ 753.98

        // ===== Audio =====
        let audioCtx = null;

        function playCompleteSound() {
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }

                const now = audioCtx.currentTime;

                // Chord: C5 + E5 + G5 (pleasant major chord)
                const frequencies = [523.25, 659.25, 783.99];

                frequencies.forEach((freq, i) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, now);

                    // Gentle envelope
                    gain.gain.setValueAtTime(0, now);
                    gain.gain.linearRampToValueAtTime(0.18, now + 0.04);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.6 + i * 0.12);

                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now + i * 0.12);
                    osc.stop(now + 0.8 + i * 0.12);
                });

                // Add a soft chime at the end
                const osc2 = audioCtx.createOscillator();
                const gain2 = audioCtx.createGain();
                osc2.type = 'sine';
                osc2.frequency.setValueAtTime(1046.50, now + 0.5);
                gain2.gain.setValueAtTime(0, now + 0.5);
                gain2.gain.linearRampToValueAtTime(0.12, now + 0.55);
                gain2.gain.exponentialRampToValueAtTime(0.01, now + 1.0);
                osc2.connect(gain2);
                gain2.connect(audioCtx.destination);
                osc2.start(now + 0.5);
                osc2.stop(now + 1.2);

            } catch (e) {
                // Silently fail if audio not supported
                console.debug('Audio play failed:', e);
            }
        }

        // ===== Progress Ring =====
        function updateRing(progress) {
            // progress: 0 (empty ring) → 1 (full ring) = state.timeLeft / state.totalTime
            const offset = CIRCUMFERENCE * progress;
            progressCircle.style.strokeDashoffset = offset;
        }

        function setRingMode(mode) {
            progressCircle.classList.remove('mode-focus', 'mode-short', 'mode-long');
            if (mode === 'focus') progressCircle.classList.add('mode-focus');
            else if (mode === 'short') progressCircle.classList.add('mode-short');
            else if (mode === 'long') progressCircle.classList.add('mode-long');

            ringContainer.className = 'progress-ring-container';
            if (mode === 'focus') ringContainer.classList.add('glow-focus');
            else if (mode === 'short') ringContainer.classList.add('glow-short');
            else if (mode === 'long') ringContainer.classList.add('glow-long');
        }

        function setTimerDisplayMode(mode) {
            timerDisplay.className = 'time';
            timerDisplay.classList.add(`mode-${mode}`);
        }

        // ===== Timer Display =====
        function formatTime(seconds) {
            const m = String(Math.floor(seconds / 60)).padStart(2, '0');
            const s = String(seconds % 60).padStart(2, '0');
            return `${m}:${s}`;
        }

        function updateDisplay() {
            timerDisplay.textContent = formatTime(state.timeLeft);
            // Color of time text
            setTimerDisplayMode(state.mode);

            const progress = state.totalTime > 0
                ? 1 - (state.timeLeft / state.totalTime)
                : 0;
            updateRing(progress);

            // Status label
            if (state.phase === 'idle') {
                statusLabel.textContent = `准备开始 — ${CONFIG[state.mode].label}`;
            } else if (state.phase === 'running') {
                statusLabel.textContent = CONFIG[state.mode].label;
            } else if (state.phase === 'paused') {
                statusLabel.textContent = '已暂停';
            } else if (state.phase === 'finished') {
                statusLabel.textContent = state.mode === 'focus' ? '专注完成！🎉' : '休息结束！';
            }

            // Update document title
            const prefix = state.isRunning ? '▶ ' : state.isPaused ? '⏸ ' : '';
            document.title = `${prefix}${formatTime(state.timeLeft)} — 番茄钟`;
        }

        // ===== Mode Switching =====
        function switchMode(mode) {
            // Stop any running timer before switching
            if (state.intervalId) {
                clearInterval(state.intervalId);
                state.intervalId = null;
            }

            state.mode = mode;
            state.totalTime = CONFIG[mode].duration;
            state.timeLeft = state.totalTime;
            state.phase = 'idle';
            state.isPaused = false;
            state.isRunning = false;

            // Update mode cards
            modeCards.forEach(card => {
                const cardMode = card.dataset.mode;
                card.className = 'mode-card';
                if (cardMode === mode) {
                    card.classList.add(`active-${mode}`);
                    card.setAttribute('aria-pressed', 'true');
                } else {
                    card.setAttribute('aria-pressed', 'false');
                }
            });

            // Update indicator
            indicator.className = 'slide';
            const posMap = { focus: 'pos-1', short: 'pos-2', long: 'pos-3' };
            const colorMap = { focus: 'color-focus', short: 'color-short', long: 'color-long' };
            indicator.classList.add(posMap[mode], colorMap[mode]);

            // Update ring
            setRingMode(mode);

            // Update main button
            mainBtn.textContent = '开始';

            // Clear any flash
            timerSection.classList.remove('flash');

            // Reset progress ring to full
            progressCircle.style.strokeDashoffset = '0';

            // Update display
            updateDisplay();
        }

        // ===== Main Control =====
        function startTimer() {
            if (state.timeLeft <= 0) {
                // If timer finished, reset before starting
                resetTimer();
                return;
            }

            if (state.isRunning) return; // already running

            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            state.isRunning = true;
            state.isPaused = false;
            state.phase = 'running';
            timerSection.classList.remove('flash');
            mainBtn.textContent = '暂停';

            if (state.intervalId) {
                clearInterval(state.intervalId);
            }

            state.intervalId = setInterval(tick, 1000);
            updateDisplay();
        }

        function pauseTimer() {
            if (!state.isRunning) return;
            state.isRunning = false;
            state.isPaused = true;
            state.phase = 'paused';
            mainBtn.textContent = '继续';

            if (state.intervalId) {
                clearInterval(state.intervalId);
                state.intervalId = null;
            }
            updateDisplay();
        }

        function resetTimer() {
            if (state.intervalId) {
                clearInterval(state.intervalId);
                state.intervalId = null;
            }
            state.isRunning = false;
            state.isPaused = false;
            state.phase = 'idle';
            state.timeLeft = state.totalTime;
            mainBtn.textContent = '开始';
            timerSection.classList.remove('flash');

            // Reset ring to full
            progressCircle.style.strokeDashoffset = '0';
            updateDisplay();
        }

        function skipTimer() {
            // Stop any running timer
            if (state.intervalId) {
                clearInterval(state.intervalId);
                state.intervalId = null;
            }
            state.isRunning = false;
            state.isPaused = false;

            // Update stats for completed focus session
            if (state.mode === 'focus') {
                state.completedPomodoros++;
                state.focusSessionCount++;
                state.totalFocusMinutes += Math.ceil(CONFIG.focus.duration / 60);
                completedCount.textContent = state.completedPomodoros;
                totalFocus.textContent = state.totalFocusMinutes;
            }

            // Determine next mode (专注 → 短休息 → 专注 → 长休息 循环)
            const nextMode = getNextMode();
            updateCurrentSessionDisplay();

            // 立即切换到下一个模式，重置倒计时为新模式总时间
            switchMode(nextMode);

            // 自动开始计时
            startTimer();
        }

        function tick() {
            if (state.timeLeft > 0) {
                state.timeLeft--;
                updateDisplay();
            }

            if (state.timeLeft <= 0) {
                // Timer complete
                if (state.intervalId) {
                    clearInterval(state.intervalId);
                    state.intervalId = null;
                }
                state.isRunning = false;
                handleTimerComplete();
            }
        }

        function handleTimerComplete() {
            state.phase = 'finished';
            state.isRunning = false;

            // Reset button to "start" state
            mainBtn.textContent = '开始';

            // Flash effect
            timerSection.classList.remove('flash');
            // Force reflow to restart animation
            void timerSection.offsetWidth;
            timerSection.classList.add('flash');

            // Sound
            playCompleteSound();

            // Update stats
            if (state.mode === 'focus') {
                state.completedPomodoros++;
                state.focusSessionCount++;
                state.totalFocusMinutes += Math.ceil(CONFIG.focus.duration / 60);
                completedCount.textContent = state.completedPomodoros;
                totalFocus.textContent = state.totalFocusMinutes;
            }

            // Determine next mode
            const nextMode = getNextMode();
            updateCurrentSessionDisplay();

            // Auto switch after a brief delay (so user sees the flash)
            // switchMode() handles: updating timeLeft, resetting ring, and calling updateDisplay()
            setTimeout(() => {
                switchMode(nextMode);
            }, 1200);
        }

        function getNextMode() {
            if (state.mode === 'focus') {
                // After focus: short break, unless it's time for long break
                if (state.focusSessionCount >= LONG_BREAK_INTERVAL) {
                    state.focusSessionCount = 0; // reset cycle
                    return 'long';
                }
                return 'short';
            } else {
                // After any break: back to focus
                return 'focus';
            }
        }

        function updateCurrentSessionDisplay() {
            const cyclePos = (state.focusSessionCount % LONG_BREAK_INTERVAL) || LONG_BREAK_INTERVAL;
            currentSession.textContent = `${cyclePos} / ${LONG_BREAK_INTERVAL}`;
        }

        // ===== Main Button Handler =====
        function handleMainButton() {
            if (state.phase === 'finished' && state.timeLeft <= 0) {
                // After completion, pressing main button should start the current mode fresh
                resetTimer();
                // Small delay then start
                setTimeout(() => startTimer(), 100);
                return;
            }

            if (state.isRunning) {
                pauseTimer();
            } else if (state.isPaused) {
                startTimer();
            } else {
                // idle state
                startTimer();
            }
        }

        // ===== Events =====
        // Mode cards
        modeCards.forEach(card => {
            card.addEventListener('click', () => {
                const mode = card.dataset.mode;
                if (mode !== state.mode) {
                    switchMode(mode);
                }
            });
        });

        // Main button
        mainBtn.addEventListener('click', handleMainButton);

        // Reset button
        resetBtn.addEventListener('click', resetTimer);

        // Skip button
        skipBtn.addEventListener('click', skipTimer);

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            // Don't capture if typing in an input
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

            if (e.key === ' ' || e.key === 'Space') {
                e.preventDefault();
                handleMainButton();
            } else if (e.key === 'r' || e.key === 'R') {
                resetTimer();
            } else if (e.key === 's' || e.key === 'S') {
                skipTimer();
            } else if (e.key === '1') {
                switchMode('focus');
            } else if (e.key === '2') {
                switchMode('short');
            } else if (e.key === '3') {
                switchMode('long');
            }
        });

        // Button hover glow effect
        document.querySelectorAll('.btn').forEach(btn => {
            btn.addEventListener('mousemove', (e) => {
                const rect = btn.getBoundingClientRect();
                const x = ((e.clientX - rect.left) / rect.width) * 100;
                const y = ((e.clientY - rect.top) / rect.height) * 100;
                btn.style.setProperty('--mx', `${x}%`);
                btn.style.setProperty('--my', `${y}%`);
            });
        });

        // ===== Init =====
        function init() {
            // Set SVG dasharray
            progressCircle.style.strokeDasharray = CIRCUMFERENCE;
            progressCircle.style.strokeDashoffset = '0';

            switchMode('focus');
            updateCurrentSessionDisplay();
            completedCount.textContent = '0';
            totalFocus.textContent = '0';
        }

        init();

    })();
</script>

</body>
</html>
